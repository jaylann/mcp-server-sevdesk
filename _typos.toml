[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "spec/openapi.yaml",
  "test/fixtures/**",
  "*.de.md",
  "*.svg",
  "dist/",
  "coverage/",
  ".git/",
  # Half of the eval prompts are German; cassettes hold recorded model text.
  "test/evals/cases.ts",
  "test/evals/cassettes/**",
  # The German page texts, the German wording of every confirmed tool's preview, and the
  # embedded fonts (base64).
  "src/pages/text/de.ts",
  "test/integration/__snapshots__/write-previews-de.test.ts.snap",
  "src/pages/assets.generated.ts",
]

[default]
# German accounting vocabulary and sevDesk API identifiers are not typos; neither are the
# code points of a CSS unicode-range (U+0100-02BA).
extend-ignore-re = [
  "(?i)\\b(rechnung|beleg|gutschrift|angebot|mahnung|steuer|umsatz)\\w*",
  "U\\+[0-9A-Fa-f]{1,6}(-[0-9A-Fa-f]{1,6})?",
  # Deliberately misspelled setting names (the check for near-misses and its documentation), and
  # the base64url test secret of the configuration tests.
  "SEVDESK_(ALOW|CONFRIM)\\b",
  "Qm9ndXMtc2VjcmV0[A-Za-z0-9_-]+",
]

[default.extend-words]
# Standard in-toto provenance filename suffix (.intoto.jsonl).
intoto = "intoto"
# sevDesk API field names (spelled this way upstream).
surename = "surename"
ammount = "ammount"
ammountPayed = "ammountPayed"
Payed = "Payed"
# German UI labels and contributor handles.
Offen = "Offen"
mastr = "mastr"
Feld = "Feld"
Tage = "Tage"
# German words in test data, fixtures and quoted sources.
Formate = "Formate"
Handel = "Handel"
ist = "ist"
Oktober = "Oktober"
Paket = "Paket"
vor = "vor"
# Deliberately mangled objectName in the error-rendering sanitizer test.
SYSTE = "SYSTE"
# Umlaut transliteration (ü → ue) in safe filenames.
ue = "ue"
Ue = "Ue"
Intervall = "Intervall"
intervall = "intervall"
unity = "unity"
# PDF stream filter names (FlateDecode, DecodeParms) and the UN/ECE unit code for tonne.
Flate = "Flate"
Parms = "Parms"
TNE = "TNE"
# German words in the reconciliation matcher (purpose keywords, abbreviated company names).
referenz = "referenz"
rech = "rech"
HANDELS = "HANDELS"
# German words in the German wording of confirmation previews, which stands next to the English
# one in the tools and their tests (docs/adr/0010-server-pages-in-two-languages.md).
Sie = "Sie"
sie = "sie"
als = "als"
oder = "oder"
ein = "ein"
alle = "alle"
ALLE = "ALLE"
unter = "unter"
Dokument = "Dokument"
Aktion = "Aktion"
Adresse = "Adresse"
legt = "legt"
Offener = "Offener"
Typs = "Typs"
passt = "passt"
separat = "separat"
# Informal address the German page texts must not use (asserted by a test).
deine = "deine"
