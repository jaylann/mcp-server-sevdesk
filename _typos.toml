[files]
extend-exclude = [
  "pnpm-lock.yaml",
  "spec/openapi.yaml",
  "test/fixtures/**",
  "*.de.md",
  "*.svg",
  "dist/",
  "coverage/",
  ".git/",
]

[default]
# German accounting vocabulary and sevDesk API identifiers are not typos.
extend-ignore-re = ["(?i)\\b(rechnung|beleg|gutschrift|angebot|mahnung|steuer|umsatz)\\w*"]

[default.extend-words]
# sevDesk API field names (spelled this way upstream).
surename = "surename"
ammount = "ammount"
ammountPayed = "ammountPayed"
Payed = "Payed"
# German UI labels and contributor handles.
Offen = "Offen"
mastr = "mastr"
Feld = "Feld"
Tage = "Tage"
# German words in test data, fixtures and quoted sources.
Formate = "Formate"
Handel = "Handel"
ist = "ist"
Oktober = "Oktober"
Paket = "Paket"
vor = "vor"
# Deliberately mangled objectName in the error-rendering sanitizer test.
SYSTE = "SYSTE"
# Umlaut transliteration (ü → ue) in safe filenames.
ue = "ue"
Ue = "Ue"
Intervall = "Intervall"
intervall = "intervall"
unity = "unity"
