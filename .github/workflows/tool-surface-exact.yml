name: Tool surface exact

# Separate workflow: evals approval cannot delay the secret-free estimate or its comment.
# Capture executes PR code with no secrets. A fresh counting job uses ONLY the base counter.
on:
  pull_request:
    paths:
      - "src/**"
      - "test/helpers/**"
      - "test/fixtures/recorded/**"
      - "test/evals/tools.ts"
      - "scripts/tool-surface*.ts"
      - ".github/workflows/tool-surface*.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".nvmrc"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    outputs:
      counter-available: ${{ steps.counter.outputs.available }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the two revisions
    steps:
      # The event's test merge commit (PR head merged into base.sha), not the bare head: a PR that is
      # behind main would otherwise show every tool main gained since it branched as "removed".
      - name: Check out PR merged into base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .cache/tool-surface-base
          persist-credentials: false
      - name: Check for a base-revision counter
        id: counter
        run: |
          if [ -f .cache/tool-surface-base/scripts/tool-surface-tokens.ts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Exact counting skipped: the base revision has no standalone counter yet; estimates remain available." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install head dependencies
        run: pnpm install --frozen-lockfile
      - name: Install base dependencies
        working-directory: .cache/tool-surface-base
        run: pnpm install --frozen-lockfile
      - name: Capture base with the same harness
        run: |
          mkdir -p "$RUNNER_TEMP/tool-surface"
          cp scripts/tool-surface*.ts .cache/tool-surface-base/scripts/
          cp -R test/fixtures/recorded/. .cache/tool-surface-base/test/fixtures/recorded/
          cd .cache/tool-surface-base
          node --import tsx scripts/tool-surface.ts dump "$RUNNER_TEMP/tool-surface/base.json"
      - name: Capture head and compare
        run: |
          node --import tsx scripts/tool-surface.ts dump "$RUNNER_TEMP/tool-surface/head.json"
          node --import tsx scripts/tool-surface.ts diff "$RUNNER_TEMP/tool-surface/base.json" "$RUNNER_TEMP/tool-surface/head.json" "$RUNNER_TEMP/tool-surface/diff.txt"
          node --import tsx scripts/tool-surface.ts report "$RUNNER_TEMP/tool-surface/base.json" "$RUNNER_TEMP/tool-surface/head.json" "$GITHUB_EVENT_PATH" "$RUNNER_TEMP/tool-surface/report.json"
      - name: Upload full surfaces and diff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-surface
          path: |
            ${{ runner.temp }}/tool-surface/base.json
            ${{ runner.temp }}/tool-surface/head.json
            ${{ runner.temp }}/tool-surface/diff.txt
            ${{ runner.temp }}/tool-surface/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload comment data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-surface-report
          path: ${{ runner.temp }}/tool-surface/report.json
          retention-days: 7
          if-no-files-found: error

  count:
    needs: compare
    if: ${{ needs.compare.outputs.counter-available == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: evals
    permissions:
      contents: read
    steps:
      # Fresh runner: no head checkout, dependency install, loader or PR-created executable.
      - name: Check out only the base counter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/tool-surface-tokens.ts
          sparse-checkout-cone-mode: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download captured JSON
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-surface
          path: ${{ runner.temp }}/tool-surface
      - name: Count JSON with the base counter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/tool-surface-tokens.ts "$RUNNER_TEMP/tool-surface/base.json" "$RUNNER_TEMP/tool-surface/head.json" "$RUNNER_TEMP/tool-surface/report.json"
      - name: Replace estimated comment data with counted data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-surface-report
          path: ${{ runner.temp }}/tool-surface/report.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error
