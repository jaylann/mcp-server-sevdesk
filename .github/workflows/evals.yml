name: Evals

# Tool-selection evals (test/evals/README.md): do the tool descriptions and the server
# instructions lead a model to the right first tool call? Informational only: the job may fail
# without blocking the PR and is not part of ci-ok (models vary between runs).
#
# Replay only: scores the committed model answers (cassettes) against the current tools and
# reports stale ones. No secret, no cost. Recording calls a paid model, and nearly every tool
# change stales every case, so it runs locally on purpose (`pnpm evals:record`), never in CI.
on:
  pull_request:
    paths:
      - "src/tools/**"
      - "src/instructions.ts"
      - "test/evals/**"
      - "vitest.evals.config.ts"
      - ".github/workflows/evals.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  replay:
    name: Evals (replay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up toolchain
        uses: $/.github/actions/setup
      # The eval writes its score table to $GITHUB_STEP_SUMMARY.
      - name: Replay recorded answers
        run: pnpm evals
