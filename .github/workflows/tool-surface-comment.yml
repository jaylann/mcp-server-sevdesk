name: Tool surface comment

# This workflow comes from the default branch. Never check out code, install dependencies,
# restore caches, or execute artifact contents in this job: it holds the comment write token.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- No checkout or execution of PR code; only validated, fenced comment data.
    workflows: [Tool surface, Tool surface exact]
    types: [completed]

permissions: {}

concurrency:
  group: tool-surface-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # download only the triggering run's report
      pull-requests: write # read the PR and create/update its sticky comment
    steps:
      - name: Download comment data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-surface-report
          path: ${{ runner.temp }}/tool-surface-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate provenance and update the sticky comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPORT_PATH: ${{ runner.temp }}/tool-surface-report/report.json
        with:
          script: |
            const fs = require('node:fs/promises');
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            if (run.event !== 'pull_request' || run.conclusion !== 'success' ||
                run.repository.full_name !== fullName ||
                !['.github/workflows/tool-surface.yml', '.github/workflows/tool-surface-exact.yml'].includes(run.path)) {
              throw new Error('Unexpected source workflow.');
            }
            const stat = await fs.lstat(process.env.REPORT_PATH);
            if (!stat.isFile() || stat.size > 300_000) throw new Error('Invalid report file.');
            const report = JSON.parse(await fs.readFile(process.env.REPORT_PATH, 'utf8'));
            const sha = /^[a-f0-9]{40}$/;
            if (!report || report.version !== 1 || !Number.isSafeInteger(report.pr) || report.pr < 1 ||
                typeof report.base !== 'string' || !sha.test(report.base) ||
                typeof report.head !== 'string' || !sha.test(report.head) ||
                typeof report.changed !== 'boolean' || typeof report.truncated !== 'boolean' ||
                typeof report.diff !== 'string' || report.diff.length > 45_000 ||
                report.changed !== (report.diff.length > 0) ||
                (!report.changed && report.truncated)) {
              throw new Error('Invalid surface report.');
            }
            const configurations = ['read', 'write', 'all', 'http-files'];
            const hasKeys = (value, keys) => value !== null && typeof value === 'object' &&
              !Array.isArray(value) && Object.keys(value).length === keys.length &&
              keys.every(key => Object.hasOwn(value, key));
            // Older v1 reports remain usable, with or without costs and with or without tool
            // definitions. New data carries only bounded integer counts: all Markdown labels
            // and formatting come from this trusted workflow.
            const cost = report.contextCost;
            const withDefinitions = hasKeys(cost?.base?.read, ['definitions', 'tools', 'instructions', 'prompts']);
            const components = withDefinitions
              ? ['definitions', 'tools', 'instructions', 'prompts']
              : ['tools', 'instructions', 'prompts'];
            if (cost !== undefined && (!hasKeys(cost, ['base', 'head']) ||
                !['base', 'head'].every(revision => hasKeys(cost[revision], configurations) &&
                  configurations.every(config => hasKeys(cost[revision][config], components) &&
                    components.every(component => {
                      const count = cost[revision][config][component];
                      return Number.isSafeInteger(count) && count >= 0 && count <= 1_000_000_000;
                    }))))) {
              throw new Error('Invalid context cost.');
            }
            const tokens = report.tokenCost;
            const responseLabels = {
              invoice_get: 'invoice_get', records_summarize: 'records_summarize (invoices by month)',
              contacts_search: 'contacts_search (default limit)', transactions_list: 'transactions_list (default limit)',
              vouchers_list: 'vouchers_list (default limit)', invoices_list: 'invoices_list (default limit)',
              invoices_list_max: 'invoices_list (limit: 100)',
            };
            const validCounts = (value, keys) => hasKeys(value, keys) && keys.every(key =>
              value[key] === null || (Number.isSafeInteger(value[key]) && value[key] >= 0 && value[key] <= 1_000_000_000));
            if (tokens !== undefined && (!hasKeys(tokens, ['method', 'model', 'base', 'head']) ||
                !['exact', 'estimated'].includes(tokens.method) || tokens.model !== 'claude-opus-5-5' ||
                !['base', 'head'].every(revision => hasKeys(tokens[revision], ['configurations', 'responses']) &&
                  validCounts(tokens[revision].configurations, configurations) &&
                  validCounts(tokens[revision].responses, Object.keys(responseLabels))) ||
                (tokens.method === 'exact' && (run.path !== '.github/workflows/tool-surface-exact.yml' ||
                  run.head_repository.full_name !== fullName)))) {
              throw new Error('Invalid token cost.');
            }
            // Artifact PR numbers are only hints. Verify the current PR against the trusted run,
            // including fork identity, even when workflow_run.pull_requests is empty for forks.
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: report.pr });
            if (pr.state !== 'open' || pr.base.repo.full_name !== fullName ||
                pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch ||
                pr.head.sha !== run.head_sha || report.head !== pr.head.sha || report.base !== pr.base.sha ||
                (run.pull_requests.length > 0 && !run.pull_requests.some(p => p.number === report.pr))) {
              core.info('Skipping a stale or unrelated surface report.');
              return;
            }
            const marker = '<!-- sevdesk-tool-surface:v1 -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo, issue_number: pr.number, per_page: 100,
            });
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' &&
              comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
            if (!report.changed && !previous && cost === undefined && tokens === undefined) return;
            const exactStamp = `<!-- sevdesk-tool-surface-tokens:${report.base}:${report.head}:exact -->`;
            // Completion order is arbitrary. An estimate must never replace exact counts for
            // the same comparison, including on reruns; a new base/head still gets fresh data.
            if (tokens?.method !== 'exact' && previous?.body?.startsWith(`${marker}\n${exactStamp}\n`)) return;
            const stamp = tokens?.method === 'exact' ? `${exactStamp}\n` : '';
            let contextCost = '';
            if (cost !== undefined && tokens === undefined) {
              const labels = {
                definitions: 'Tool definitions', model: '**Model context**', tools: 'tools/list',
                instructions: 'Instructions', prompts: 'prompts/list', total: 'Total',
              };
              const sums = { model: ['definitions', 'instructions'], total: ['tools', 'instructions', 'prompts'] };
              const rowOrder = withDefinitions
                ? ['definitions', 'instructions', 'model', 'tools', 'prompts', 'total']
                : ['tools', 'instructions', 'prompts', 'total'];
              const format = value => value.toLocaleString('en-US', { maximumFractionDigits: 2 });
              const signed = value => (value > 0 ? '+' : '') + format(value);
              const pair = (value, delta = false) => {
                const number = delta ? signed : format;
                return `${number(value)} / ${number(value / 4)}`;
              };
              // A nonzero change too small for two decimals reads "<0.01%", never "+0%" or "-0%".
              const percent = (base, head) => {
                if (base === 0) return head === 0 ? '0%' : 'n/a (base 0)';
                const value = (head - base) / base * 100;
                if (head !== base && format(Math.abs(value)) === '0') return (head > base ? '+' : '-') + '<0.01%';
                return `${signed(value)}%`;
              };
              const rows = [];
              for (const config of configurations) {
                for (const component of rowOrder) {
                  const count = revision => Object.hasOwn(sums, component)
                    ? sums[component].reduce((sum, key) => sum + cost[revision][config][key], 0)
                    : cost[revision][config][component];
                  const base = count('base');
                  const head = count('head');
                  rows.push(`| ${config} | ${labels[component]} | ${pair(base)} | ${pair(head)} | ${pair(head - base, true)} | ${percent(base, head)} |`);
                }
              }
              const legend = withDefinitions
                ? '**Model context** is what clients usually put in front of the model: tool definitions ' +
                  '(name, description and input schema, the fields function-calling APIs take) plus the ' +
                  'instructions. tools/list is the full protocol response; its output schemas and annotations ' +
                  'stay with the client. prompts/list is shown to the user, not the model. ' +
                  'Total sums tools/list, instructions and prompts/list. '
                : 'Totals sum the three components. ';
              contextCost = '### Context cost\n\n' +
                'Estimated tokens = characters / 4, calculated locally without an API key. ' +
                'Characters are Unicode code points in compact JSON result objects and raw instructions. ' +
                'Prompt bodies (prompts/get), JSON-RPC envelopes ' +
                'and client formatting are excluded; actual model context use varies by client. ' +
                legend + 'Percentage changes apply to both characters and estimated tokens.\n\n' +
                '| Configuration | Surface | Base chars / est. tokens | Head chars / est. tokens | Δ chars / est. tokens | Δ % |\n' +
                '| --- | --- | ---: | ---: | ---: | ---: |\n' + rows.join('\n') + '\n\n';
            }
            if (tokens !== undefined) {
              const format = value => value.toLocaleString('en-US');
              const signed = value => (value > 0 ? '+' : '') + format(value);
              const row = (label, base, head) => `| ${label} | ${base === null ? 'n/a' : format(base)} | ` +
                `${head === null ? 'n/a' : format(head)} | ${base === null || head === null ? 'n/a' : signed(head - base)} |`;
              const table = (title, keys, labels, section) => `### ${title}\n\n` +
                '| Configuration / call | Base tokens | Head tokens | Δ tokens |\n' +
                '| --- | ---: | ---: | ---: |\n' + keys.map(key =>
                  row(labels[key] ?? key, tokens.base[section][key], tokens.head[section][key])).join('\n') + '\n\n';
              contextCost = (tokens.method === 'exact'
                ? '**Exact** tokens via messages.countTokens (claude-opus-5-5), context less its calibration message; responses less framing only. '
                : '**Estimated** tokens = characters ÷ 2.3 (Unicode code points, rounded). ') +
                'Model context uses legacy Claude tool definitions (name, description, input_schema) plus instructions as the system prompt. ' +
                'Response counts include the actual text blocks, including summaries and fences; client message envelopes are excluded. ' +
                'Missing captures are n/a.\n\n' +
                table('Model context', configurations, {}, 'configurations') +
                table('Response cost', Object.keys(responseLabels), responseLabels, 'responses') +
                'Deterministic corpus: recorded row shapes expanded to 100 items per list with distinct ids. ' +
                'Default-limit calls and invoices_list limit: 100 run through the server; missing or failed captures are n/a. Clock fixed to 2026-11-13.\n\n';
              if (cost !== undefined) {
                contextCost += '<details>\n<summary>Full tools/list — not in model context for Claude clients</summary>\n\n' +
                  'Modern protocol including output schemas; Unicode characters, not model tokens.\n\n' +
                  '| Configuration | Base chars | Head chars | Δ chars |\n| --- | ---: | ---: | ---: |\n' +
                  configurations.map(config => row(config, cost.base[config].tools, cost.head[config].tools)).join('\n') +
                  '\n\n</details>\n\n';
              }
            }
            // Keep artifact text inside a literal block, even if tool text contains backticks,
            // HTML or mentions. No value from the artifact is evaluated as code or Markdown.
            const literal = report.diff.replaceAll('`', '\\u0060').replaceAll('@', '\\u0040');
            const clipped = literal.length > 48_000;
            const detail = report.changed
              ? '```diff\n' + literal.slice(0, 48_000) + '\n```\n' +
                (report.truncated || clipped ? '\nDiff truncated; download the full diff from the run artifacts.\n' : '')
              : 'No change in tools/list, prompts/list or instructions for any of the four configurations.\n';
            const runUrl = `${context.serverUrl}/${fullName}/actions/runs/${run.id}`;
            const body = `${marker}\n${stamp}## MCP tool surface\n\n` +
              `Base \`${report.base}\` → head \`${report.head}\`. [Full JSON and diff](${runUrl}).\n\n` +
              'Configurations: read, write, all toolsets/tiers, HTTP with files. ' +
              'Review names and schemas for compatibility; text changes alone are not breaking changes.\n\n' +
              contextCost + detail;
            if (previous) {
              if (previous.body !== body) await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body });
            }
