name: Scorecard supply-chain security

# Follows the official OpenSSF Scorecard workflow. With `publish_results: true` the Scorecard API
# verifies this file: no top-level env/defaults, no write permissions outside the job, and only
# approved actions in the job.
on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check fresh. Tuesdays 07:20 UTC.
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `publish_results: true` only works from the default branch.
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    permissions:
      actions: read # read workflow runs for the checks
      contents: read # check out and read the repository
      id-token: write # publish results to the OpenSSF API and enable the badge
      security-events: write # upload results to code scanning
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
