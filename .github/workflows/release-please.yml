name: Release

# On every push to main, release-please opens or updates the release PR. Merging that PR creates
# the GitHub release and tag; the publish jobs then ship the same commit:
#   build-npm         builds and packs the npm package without privileges (contents: read)
#   publish-npm       publishes that tarball: npm trusted publishing with provenance (no
#                     NPM_TOKEN), no dependency install
#   publish-image     ghcr.io/jaylann/mcp-server-sevdesk for linux/amd64 and linux/arm64, with an
#                     SBOM and a build provenance attestation
#   image-smoke       the pushed image, pulled by digest on an amd64 and an arm64 runner
#   publish-registry  server.json to the MCP Registry (GitHub OIDC), once npm and the image are live
#   build-mcpb        builds, validates and smoke-tests the Claude Desktop extension (.mcpb)
#                     without privileges
#   publish-mcpb      attests that bundle and attaches it to the release, no dependency install
#
# Dependency code (pnpm install, the build tools, the mcpb CLI) runs only in jobs without an OIDC
# token, a write permission or the release environment. The jobs that hold those take files built
# earlier in the same run and run only plain Node, npm and gh.
on:
  push:
    branches: [main]

permissions: {}

# Never cancel a release in flight; queue the next push behind it instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release commits, tags and GitHub releases
      issues: write # create and apply the "autorelease: *" labels
      pull-requests: write # open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so CI would not run on
          # the release PR. An optional fine-grained token (contents + pull requests: write on this
          # repo only) fixes that; without it, close and reopen the release PR to run CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps package.json, server.json, plugin.json and the deploy templates, but cannot
  # write "mcp-server-sevdesk@<version>" into the plugin's npx argument or "<image>:<version>" into
  # server.json's OCI identifier (its JSON updater replaces whole values). This job adds those two
  # changes to the release PR after every update, so the merged release pins the version it
  # publishes. Plain Node, no dependency install: the job can push.
  pin-plugin:
    name: Pin the plugin and the image in the release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the pin commit to the release PR branch
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Check out the release PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Pin plugin/.mcp.json and server.json to the release version
        run: node scripts/pin-plugin-version.ts

      - name: Commit and push the pin
        env:
          # The release-please token, so CI runs on the pushed commit when that token is set.
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          if git diff --quiet -- plugin/.mcp.json server.json; then
            echo "plugin/.mcp.json and server.json already pin the release version."
            exit 0
          fi
          case "$BRANCH" in
            release-please--*) ;;
            *) echo "::error::Refusing to push to $BRANCH (not a release-please branch)."; exit 1 ;;
          esac
          version="$(node -p 'require("./package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: pin the plugin and the image to $version" -- plugin/.mcp.json server.json
          git push --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

  # Builds and packs the package from the release tag without a dependency cache. Read-only, no
  # OIDC token, no environment: whatever a dependency does here cannot publish anything.
  build-npm:
    name: Build the npm package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the release tag
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/jaylann/mcp-server-sevdesk
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # No dependency cache in release jobs, so a poisoned cache cannot reach the package.
      - name: Set up toolchain
        uses: $/.github/actions/setup
        with:
          cache: "false"

      - name: Check that package.json, server.json and the plugin carry the release version
        run: node scripts/pin-plugin-version.ts --check "$VERSION" --image "$IMAGE"

      - name: Build
        run: pnpm build

      - name: Lint the package (publint)
        run: pnpm publint

      - name: Pack
        run: |
          mkdir -p build/npm
          npm pack --pack-destination build/npm
          test -f "build/npm/mcp-server-sevdesk-$VERSION.tgz"

      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: build/npm/mcp-server-sevdesk-*.tgz
          if-no-files-found: error
          retention-days: 1

  # Publishes the tarball build-npm packed. The provenance statement is made here, by the job that
  # publishes (npm signs it with this job's OIDC token), and names this workflow and the release
  # tag. Nothing is installed: plain Node and the npm it bundles, with scripts off.
  publish-npm:
    name: Publish to npm
    needs: [release-please, build-npm]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://www.npmjs.com/package/mcp-server-sevdesk
    permissions:
      contents: read # check out the release tag (package name, version check)
      id-token: write # OIDC for npm trusted publishing + provenance
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/jaylann/mcp-server-sevdesk
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check that package.json, server.json and the plugin carry the release version
        run: node scripts/pin-plugin-version.ts --check "$VERSION" --image "$IMAGE"

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: build/npm

      - name: Check the tarball's name and version
        run: |
          expected="$(node -p 'require("./package.json").name')@$VERSION"
          tarball="build/npm/mcp-server-sevdesk-$VERSION.tgz"
          test -f "$tarball"
          packed="$(tar -xOzf "$tarball" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            console.log(pkg.name + "@" + pkg.version);
          ')"
          if [ "$packed" != "$expected" ]; then
            echo "::error::The tarball holds $packed, expected $expected."
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles a newer npm, so no upgrade step;
      # this only fails loudly if that ever stops being true.
      - name: Check the npm version
        run: |
          node -e '
            const [have, need] = [process.argv[1], "11.5.1"].map((v) => v.split(".").map(Number));
            const older = have[0] - need[0] || have[1] - need[1] || have[2] - need[2];
            if (older < 0) {
              console.log("::error::npm " + process.argv[1] + " is too old for trusted publishing (need >= 11.5.1)");
              process.exit(1);
            }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"

      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          if [ -n "$(npm view "$name@$VERSION" version --prefer-online 2>/dev/null)" ]; then
            echo "$name@$VERSION is already on npm; skipping (re-run)."
          else
            npm publish "build/npm/$name-$VERSION.tgz" --provenance --access public --ignore-scripts
          fi

      # The MCP Registry verifies the npm package (mcpName) before accepting server.json.
      - name: Wait until the version is visible on npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          for _ in $(seq 1 30); do
            if [ "$(npm view "$name@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
              echo "$name@$VERSION is live."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$name@$VERSION did not appear on npm within 5 minutes."
          exit 1

  # Builds on the amd64 runner for both platforms: the build stages run natively and the runtime
  # stage only copies files, so no emulation. No layer cache, so nothing cached can reach the image.
  publish-image:
    name: Publish the container image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release
      url: https://github.com/jaylann/mcp-server-sevdesk/pkgs/container/mcp-server-sevdesk
    permissions:
      contents: read # check out the release tag
      packages: write # push the image to ghcr.io
      id-token: write # sign the build provenance attestation (Sigstore, GitHub OIDC)
      attestations: write # store the build provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/jaylann/mcp-server-sevdesk
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check that server.json names this image and version
        run: node scripts/pin-plugin-version.ts --check "$VERSION" --image "$IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags <version>, <major>.<minor> and latest (not for pre-releases); OCI labels and
      # annotations from the repository (source, revision, version, license).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      # Verifiable with `gh attestation verify oci://ghcr.io/jaylann/mcp-server-sevdesk:<version>
      # --owner jaylann`.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Pulls the pushed image by digest on each platform's runner and runs the checks of CI's docker
  # job against it (.github/actions/image-smoke).
  image-smoke:
    name: Image smoke (${{ matrix.runner }})
    needs: [release-please, publish-image]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # check out the release tag (the smoke script)
      packages: read # pull the image while the package is still private
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    env:
      IMAGE: ghcr.io/jaylann/mcp-server-sevdesk
      DIGEST: ${{ needs.publish-image.outputs.digest }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up toolchain
        uses: $/.github/actions/setup
        with:
          cache: "false"

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull the image by digest
        run: docker pull "$IMAGE@$DIGEST"

      - name: Smoke-test the image
        uses: $/.github/actions/image-smoke
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}

  # Runs once npm has the package and the image passed its smoke test on both platforms. The MCP
  # Registry pulls the image anonymously to check its label, so the GHCR package must be public:
  # after the first image release, make it public and re-run this job.
  publish-registry:
    name: Publish to the MCP Registry
    needs: [release-please, publish-npm, publish-image, image-smoke]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the release tag
      id-token: write # GitHub OIDC login to the MCP Registry
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/jaylann/mcp-server-sevdesk
      # mcp-publisher release binary, pinned by version and SHA-256 (linux_amd64).
      MCP_PUBLISHER_VERSION: 1.8.8
      MCP_PUBLISHER_SHA256: 09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check that server.json carries the release version (npm and OCI)
        run: node scripts/pin-plugin-version.ts --check "$VERSION" --image "$IMAGE"

      - name: Check that the image is public
        run: |
          repository="${IMAGE#ghcr.io/}"
          # An anonymous pull token, as the registry's validator gets one (empty when refused).
          token="$(curl --silent --retry 3 "https://ghcr.io/token?scope=repository:${repository}:pull" \
            | jq -r '.token // empty' 2> /dev/null || true)"
          if [ -n "$token" ] && curl --fail --silent --output /dev/null --retry 3 \
            --header "Authorization: Bearer $token" \
            --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${repository}/manifests/${VERSION}"; then
            echo "$IMAGE:$VERSION can be pulled anonymously."
          else
            echo "::error title=Image not public::$IMAGE:$VERSION cannot be pulled anonymously, and the MCP Registry accepts only public images. Make the package public (package settings > Change visibility), then re-run this job."
            exit 1
          fi

      - name: Install mcp-publisher (checksum-verified)
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION"
          asset="mcp-publisher_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          cd "$dir"
          curl --fail --silent --show-error --location --retry 3 --output "$asset" "$base/$asset"
          curl --fail --silent --show-error --location --retry 3 --output checksums.txt \
            "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"

          # The tarball must match the release's checksums file ...
          line="$(awk -v f="$asset" '$2 == f' checksums.txt)"
          if [ -z "$line" ]; then
            echo "::error::$asset is not listed in the release checksums file."
            exit 1
          fi
          echo "$line" | sha256sum --check --strict -
          # ... and the hash pinned in this workflow, so a replaced asset plus checksums file fails.
          echo "$MCP_PUBLISHER_SHA256  $asset" | sha256sum --check --strict -

          tar -xzf "$asset" mcp-publisher
          test -x mcp-publisher

      - name: Publish server.json to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish

  # Builds the Claude Desktop extension from the release tag without a dependency cache (`pnpm mcpb`
  # also validates the manifest and smoke-tests the packed file). Read-only, no OIDC token.
  build-mcpb:
    name: Build the .mcpb
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the release tag
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # No dependency cache in release jobs, so a poisoned cache cannot reach the bundle.
      - name: Set up toolchain
        uses: $/.github/actions/setup
        with:
          cache: "false"

      - name: Check that every file, the .mcpb manifest included, carries the release version
        run: node scripts/pin-plugin-version.ts --check "$VERSION"

      - name: Build, validate, pack and smoke-test the bundle
        run: pnpm mcpb

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: build/mcp-server-sevdesk-*.mcpb
          if-no-files-found: error
          retention-days: 1

  # Attests the build provenance of the bundle build-mcpb made and attaches it to the GitHub
  # release; nothing is installed. Verifiable with
  # `gh attestation verify mcp-server-sevdesk-<version>.mcpb --owner jaylann`.
  publish-mcpb:
    name: Attach the .mcpb to the release
    needs: [release-please, build-mcpb]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://github.com/jaylann/mcp-server-sevdesk/releases/tag/${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write # upload the bundle to the GitHub release
      id-token: write # sign the build provenance attestation (Sigstore, GitHub OIDC)
      attestations: write # store the build provenance attestation
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check that every file, the .mcpb manifest included, carries the release version
        run: node scripts/pin-plugin-version.ts --check "$VERSION"

      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: build

      - name: Check the bundle's name and manifest version
        run: |
          bundle="build/mcp-server-sevdesk-$VERSION.mcpb"
          test -f "$bundle"
          packed="$(unzip -p "$bundle" manifest.json | node -e '
            console.log(JSON.parse(require("node:fs").readFileSync(0, "utf8")).version);
          ')"
          if [ "$packed" != "$VERSION" ]; then
            echo "::error::The bundle's manifest says $packed, expected $VERSION."
            exit 1
          fi

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/mcp-server-sevdesk-${{ env.VERSION }}.mcpb

      - name: Attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "build/mcp-server-sevdesk-$VERSION.mcpb" \
            --clobber --repo "$GITHUB_REPOSITORY"
