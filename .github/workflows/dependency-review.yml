name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read the dependency graph diff
      pull-requests: write # post the summary comment (only a warning on fork PRs, where it is read-only)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6, memory exhaustion on oversized input) has no fixed
          # 3.x. zod 3 comes in only with the dev tool @anthropic-ai/mcpb, which validates the
          # manifest we generate at build time; the package and the .mcpb ship zod 4.6.7. Remove
          # once @anthropic-ai/mcpb moves to zod 4.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5
